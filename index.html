<style>

  --bg:#ECEEE8; --card:#F7F8F4; --ink:#16252A; --mute:#5C6A68; --line:#D2D8D1;

    --bg:#11191B; --card:#1A2427; --ink:#E7EDE8; --mute:#93A29E; --line:#2B393C;
    --pine:#6DB39D; --ice:#7DB0C4; --lichen:#C3D060; --warn:#E3806B; --onpine:#11191B;

  --bg:#11191B; --card:#1A2427; --ink:#E7EDE8; --mute:#93A29E; --line:#2B393C;

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-bottom:84px}

h1,h2,h3{font-family:var(--head);font-weight:800;letter-spacing:.01em;margin:0;line-height:1.05}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:20px 0 12px}

<body>
<div id="app"></div>
<nav class="tabs" id="nav" hidden></nav>
<div id="modal"></div>
<script>
/* ============ Config de l'événement (tout ce qui est spécifique à CETTE course) ============ */
/* Un profil sportif (générique) peut un jour préparer plusieurs événements comme celui-ci.
   Pour l'instant un seul événement actif, mais tout ce qui lui est propre reste ici. */
/* Les événements intégrés (connus à l'avance). D'autres peuvent être ajoutés par la personne
   (recherche avec Claude) et sont alors stockés dans S.customEvents. */
const BUILTIN_EVENTS = {
  'ultra-morzine-2027': {
    id: 'ultra-morzine-2027',
    name: 'Ultra Spartan Morzine-Avoriaz',
    shortName: 'Ultra Morzine',
    dateLabel: '2 juillet 2027',
    finishLabel: 'Nyon · 2 juil.',
    start: new Date(2026, 9, 5),   // lundi 5 octobre 2026
    race:  new Date(2027, 6, 2),   // vendredi 2 juillet 2027
    nw: 39,
    phases: ['Base','Volume','Spécifique','Pic','Affûtage'],
    phaseStart: [0,10,21,30,36],
    recommendedDays: "Pour un ultra-trail avec obstacles comme celui-ci, compte au moins 4 jours par semaine à l'approche du pic de préparation (le nombre réel pourra démarrer plus bas et varier selon les semaines).",
    description: 'Ultra-trail avec obstacles (OCR), 50 km, 60 obstacles, sommet à la pointe de Nyon (~2500 m).',
    raceSession: {title:'ULTRA SPARTAN 50K', desc:`Jour J à Morzine-Avoriaz. 50 km, 60 obstacles. Pars prudent, bois et mange tôt.`}
  }
};
/* L'événement actif à l'écran — réassigné par setActiveEvent() avant chaque rendu.
   Tout le reste du code lit EVENT.xxx librement, comme s'il n'y en avait qu'un. */
let EVENT = BUILTIN_EVENTS['ultra-morzine-2027'];
function eventDef(id) {
  if (BUILTIN_EVENTS[id]) return BUILTIN_EVENTS[id];
  const c = S.customEvents && S.customEvents[id];
  if (!c) return null;
  return {...c, start: new Date(c.start), race: new Date(c.race)};
}
function setActiveEvent(id) { const d = eventDef(id); if (d) EVENT = d; return d; }
const KEY = 'ultra-morzine-v2';

/* Liste de suggestions pour "quels sports pratiques-tu" — l'utilisateur peut aussi taper autre chose. */
const SPORTS_LIST = ['Course à pied','Trail','Triathlon','Duathlon','Natation','Cyclisme / Vélo','VTT','Musculation','CrossFit',
  'Haltérophilie','Football','Rugby','Handball','Basketball','Volleyball','Tennis','Badminton','Squash','Tennis de table',
  'Boxe','Judo','Karaté','Taekwondo','MMA','Lutte','Jiu-jitsu brésilien','Escalade','Ski alpin','Ski de fond','Snowboard',
  'Randonnée','Alpinisme','Golf','Aviron','Kayak / Canoë','Voile','Planche à voile','Surf','Plongée','Équitation','Danse',
  'Yoga','Pilates','Gymnastique','Escrime','Tir à l\'arc','Roller','Skateboard','Patinage','Hockey sur glace','Pétanque',
  'Cricket','Baseball','Water-polo','Parkour','Fitness / Aérobic'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm = m => { m = Math.round(m || 0); const h = Math.floor(m/60), r = m % 60; return h ? h + 'h' + String(r).padStart(2,'0') : r + ' min'; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fd = d => d.toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const dayDiff = (a, b) => Math.round((midnight(a) - midnight(b)) / 864e5);
const weekOf = d => Math.max(0, Math.min(EVENT.nw-1, Math.floor(dayDiff(d, EVENT.start) / 7)));
const phaseOf = i => { let p = 1; EVENT.phaseStart.forEach((s, k) => { if (i >= s) p = k + 1; }); return p; };
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const mondayOfWeek = d => { d = new Date(d); const diff = (d.getDay() + 6) % 7; d.setDate(d.getDate() - diff); d.setHours(0,0,0,0); return d; };
/* Répartit les 5 phases proportionnellement à la durée de la préparation, sur le même gabarit que Morzine. */
function scalePhases(nw) {
  const raw = [0,10,21,30,36].map(x => Math.round(x * nw / 39));
  const ps = []; let last = -1;
  raw.forEach(v => { v = Math.max(last + 1, Math.min(nw - 1, v)); ps.push(v); last = v; });
  return ps;
}
const sportChipHtml = s => `<span class="chip soft sportchip" data-sport-chip="${esc(s)}">${esc(s)} <button type="button" data-act="rmSport" data-sport="${esc(s)}" aria-label="Retirer ${esc(s)}">×</button></span>`;
function addSportValue(v) {
  v = (v || '').trim(); if (!v) return;
  const hid = $('#f-sports-json'); if (!hid) return;
  let arr = []; try { arr = JSON.parse(hid.value || '[]'); } catch (e) {}
  if (arr.some(x => x.toLowerCase() === v.toLowerCase())) return;
  arr.push(v); hid.value = JSON.stringify(arr);
  $('#sportChips').insertAdjacentHTML('beforeend', sportChipHtml(v));
}

/* ============ Assemblage du plan ============
   Le contenu (quelles séances, quel volume, quelle progression) n'est plus calculé
   par une formule : il est écrit par Claude à partir du profil complet de la personne
   (voir planPrompt() et l'action "importPlan"), et stocké tel quel dans ev().plan.
   Cette fonction se contente d'assembler : calendrier (dates, phases), semaines "avant
   le départ", semaine de course (fixe), et l'allègement -20% quand il est actif. */
function assemblePlan(aiWeeks, overrides, startIdx) {
  aiWeeks = aiWeeks || {}; overrides = overrides || {};
  const weeks = [];
  for (let i = 0; i < EVENT.nw; i++) {
    const ph = phaseOf(i), start = addDays(EVENT.start, i * 7);
    const before = i < startIdx;
    let rec = false, light = false, sessions = [];
    if (!before) {
      if (i === EVENT.nw - 1) {
        sessions = [
          {day:'Mar', type:'course', title:'Course facile', desc:'Allure où tu peux parler, reste frais pour le jour J.', min:25, run:true},
          {day:'Mer', type:'mobilite', title:'Mobilité & activation', desc:'20 min de mobilité, quelques accélérations douces.', min:20, run:false},
          {day:'Ven', type:'course', title:EVENT.raceSession.title, desc:EVENT.raceSession.desc, min:0, run:false}
        ].map(s => ({...s, id:i+'-'+s.day}));
      } else {
        const w = aiWeeks[i] || {sessions:[]};
        rec = !!w.rec;
        sessions = (w.sessions || []).map(s => ({...s, id:i+'-'+s.day}));
        if (overrides[i]) {
          light = true;
          sessions = sessions.map(s => s.run ? {...s, min:Math.max(10, Math.round(s.min * overrides[i] / 5) * 5)} : s);
        }
      }
    }
    const target = sessions.filter(s => s.run).reduce((a, s) => a + (s.min || 0), 0);
    weeks.push({i, ph, start, end:addDays(start, 6), before, rec, light, sessions, target});
  }
  return weeks;
}

/* ============ État & stockage ============ */
let S = {v:2, profile:null, events:{}, customEvents:{}, viewEventId:null, share:true, updated:0};
let PLAN = [], tab = 'sem', cur = weekOf(new Date()), vw = cur, openId = null;
let GROUP = [], gOpen = null, gWeek = cur, groupSub = null, lastSum = '';

// Progression sur l'événement courant (séances faites, semaines allégées...).
// Séparée du profil sportif : un même profil pourra un jour suivre plusieurs événements.
// ev() ne crée rien : son absence veut dire "pas encore choisi cet objectif" (tableau de bord vide).
function ev() { return S.events[EVENT.id]; }
function ensureEvent() {
  if (!S.events[EVENT.id]) S.events[EVENT.id] = {startIdx: Math.min(33, weekOf(new Date())), overrides:{}, log:{}};
  return S.events[EVENT.id];
}
function rebuild() { const E = ev(); PLAN = (S.profile && E && E.plan) ? assemblePlan(E.plan, E.overrides, E.startIdx) : []; }
/* Choisit quelle course regarder (par défaut la première commencée) et rend EVENT actif en conséquence.
   À appeler avant rebuild()/ev() dès que S a pu changer de course en dehors du flux normal de clic. */
function syncActiveEvent() {
  const prevId = EVENT && EVENT.id;
  if (!S.viewEventId || !S.events[S.viewEventId]) {
    const ids = Object.keys(S.events);
    if (ids.length) S.viewEventId = ids[0];
  }
  if (S.viewEventId) setActiveEvent(S.viewEventId);
  // Chaque course a son propre calendrier : "la semaine actuelle" ne veut dire la même chose que dans la course qu'on regarde.
  if (EVENT && EVENT.id !== prevId) { cur = weekOf(new Date()); vw = cur; }
  return !!(S.viewEventId && S.events[S.viewEventId]);
}

const Store = {
  ok:false, uid:null, db:null, canWrite:true,
  async init() {
    try {
      if (typeof claude === 'undefined') return;
      const u = await claude.use('user');
      this.uid = u ? await u.id() : null;
      if (u) { const c = await u.can('data.write'); this.canWrite = c !== false; }
      this.db = await claude.use('db');
    } catch (e) { this.db = null; }
    this.ok = !!(this.db && this.uid);
  },
  mineRef() { return this.db.doc('data/users/' + this.uid + '/app'); },
  async loadMine() { const s = await this.mineRef().get(); return s.exists ? s.data() : null; },
  async saveMine(state) { await this.mineRef().set({json: JSON.stringify(state), updated: state.updated}); },
  async publish(sum) { const ref = this.db.doc('athletes/' + this.uid); if (sum) await ref.set(sum); else await ref.delete(); },
  subscribe(cb) { return this.db.collection('athletes').onSnapshot(s => cb(s.docs.map(d => ({id:d.id, data:d.data()}))), () => {}); }
};

let saveT = null, saving = false, dirty = false;
function persist() {
  S.updated = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  dirty = true; clearTimeout(saveT); saveT = setTimeout(flush, 900);
}
async function flush() {
  if (saving || !dirty || !Store.ok) return;
  saving = true; dirty = false;
  try {
    await Store.saveMine(S);
    // Le groupe ne suit que l'Ultra Morzine (l'objectif commun) : on partage toujours celle-ci,
    // quelle que soit la course affichée à l'écran — une seule doc Firestore par personne.
    const morzineId = 'ultra-morzine-2027';
    if (Store.canWrite && S.profile && S.events[morzineId] && S.events[morzineId].plan) {
      const keepEvent = EVENT, keepPlan = PLAN;
      setActiveEvent(morzineId);
      PLAN = assemblePlan(ev().plan, ev().overrides, ev().startIdx);
      const sum = S.share ? summary() : null;
      EVENT = keepEvent; PLAN = keepPlan;
      const str = sum ? JSON.stringify({...sum, upd:0}) : 'off';
      if (str !== lastSum) { await Store.publish(sum); lastSum = str; }
    }
  } catch (e) {}
  saving = false; if (dirty) flush();
}

function summary() {
  const E = ev(), weeks = {}, ses = {};
  PLAN.forEach(w => {
    let m = 0, k = 0, d = 0, n = 0;
    w.sessions.forEach(s => {
      const l = E.log[s.id];
      if (l && l.done) {
        n++; const mm = num(l.min) || s.min;
        if (s.run) { m += mm; k += num(l.km); d += num(l.dplus); }
        ses[s.id] = {m:mm, k:num(l.km), d:num(l.dplus)};
      }
    });
    if (n) weeks[w.i] = {m, k:Math.round(k * 10) / 10, d, n, t:w.sessions.length};
  });
  // Plan déjà assemblé (allègements compris) partagé tel quel : pas de formule à rejouer côté amis.
  const plan = PLAN.map(w => ({i:w.i, ph:w.ph, rec:w.rec, light:w.light, before:w.before, target:w.target,
    sessions: w.sessions.map(s => ({id:s.id, day:s.day, title:s.title, min:s.min, run:s.run}))}));
  return {name:S.profile.name, fullName:S.profile.fullName || '', plan, weeks, ses, upd:Date.now()};
}

/* ============ Calculs ============ */
function weekStats(w) {
  let m = 0, k = 0, d = 0, n = 0, fa = [], rp = [], L = ev().log;
  w.sessions.forEach(s => {
    const l = L[s.id] || {};
    if (l.done) {
      n++;
      if (s.run) { m += num(l.min) || s.min; k += num(l.km); d += num(l.dplus); }
    }
    if (l.fat) fa.push(+l.fat);
    if (l.rpe) rp.push(+l.rpe);
  });
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
  return {m, k, d, n, t:w.sessions.length, fat:avg(fa), rpe:avg(rp)};
}
function advice(i) {
  const E = ev();
  if (!S.profile || i <= E.startIdx || i - 1 > cur || E.overrides[i]) return null;
  const pw = PLAN[i - 1]; if (!pw.sessions.length) return null;
  let pain = false;
  pw.sessions.forEach(s => { const l = E.log[s.id]; if (l && l.pain && l.pain.trim()) pain = true; });
  const st = weekStats(pw), why = [];
  if (st.fat >= 8) why.push('fatigue moyenne élevée (' + st.fat.toFixed(1) + '/10)');
  if (pain) why.push('douleur signalée');
  if (st.t && st.n / st.t < .5) why.push('moins de la moitié des séances faites');
  return why.length ? why : null;
}
function streak() {
  let c = 0;
  for (let i = cur - 1; i >= ev().startIdx; i--) {
    const st = weekStats(PLAN[i]);
    if (st.t && st.n / st.t >= .75) c++; else break;
  }
  return c;
}

/* ============ Graphique : profil de montagne ============ */
function chart(plan, doneBy, curW) {
  const W = 360, bx = 10, bw = 340, base = 142, top = 20;
  const mx = Math.max(60, ...plan.map(w => w.target), ...Object.values(doneBy));
  const X = i => bx + bw * i / (EVENT.nw - 1), Y = v => base - (v / mx) * (base - top);
  let line = '';
  plan.forEach((w, i) => { line += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(w.target).toFixed(1); });
  const area = line + `L${X(EVENT.nw-1).toFixed(1)} ${base}L${X(0).toFixed(1)} ${base}Z`;
  let bars = '', lab = '';
  plan.forEach((w, i) => { const v = doneBy[i]; if (v) bars += `<rect x="${(X(i)-2.8).toFixed(1)}" y="${Y(v).toFixed(1)}" width="5.6" height="${(base-Y(v)).toFixed(1)}" rx="1.5" fill="var(--lichen)"/>`; });
  EVENT.phaseStart.forEach((s, k) => {
    lab += `<line x1="${X(s).toFixed(1)}" x2="${X(s).toFixed(1)}" y1="${top-6}" y2="${base}" stroke="var(--line)" stroke-dasharray="2 3"/>`;
    lab += `<text x="${(X(s)+3).toFixed(1)}" y="${base+14}" font-size="9.5" fill="var(--mute)">${EVENT.phases[k]}</text>`;
  });
  const cx = X(curW).toFixed(1);
  return `<svg viewBox="0 0 ${W} 166" role="img" aria-label="Volume de course par semaine, prévu et réalisé">
    ${lab}
    <path d="${area}" fill="var(--ice)" fill-opacity=".18"/>
    <path d="${line}" fill="none" stroke="var(--ice)" stroke-width="2" stroke-linejoin="round"/>
    ${bars}
    <line x1="${cx}" x2="${cx}" y1="${top-8}" y2="${base}" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="${cx}" y="${top-11}" font-size="9.5" text-anchor="middle" fill="var(--ink)">auj.</text>
    <path d="M${X(EVENT.nw-1).toFixed(1)} ${base} V${top-6} l-9 4 l9 4" fill="var(--warn)" stroke="var(--warn)"/>
    <text x="${(X(EVENT.nw-1)-4).toFixed(1)}" y="${top-8}" font-size="9.5" text-anchor="end" fill="var(--warn)">${EVENT.finishLabel}</text>
  </svg>
  <div class="legend"><span><i style="background:var(--ice);opacity:.5"></i>prévu</span><span><i style="background:var(--lichen)"></i>réalisé</span></div>`;
}

/* ---- Étape 3 : génération du plan par Claude (pas de formule, un vrai raisonnement sur le profil complet) ---- */
function planPrompt() {
  const p = S.profile, a = ev().assess, startIdx = ev().startIdx;
  const injTxt = p.injuryAreas.length ? p.injuryAreas.join(', ') + (p.limits ? ' — ' + p.limits : '') : (p.limits || 'aucune connue');
  const sportsTxt = p.sports.length ? p.sports.join(', ') : 'aucun autre sport pratiqué actuellement';
  const phasesTxt = EVENT.phases.map((ph, k) => `- ${ph} : semaines ${EVENT.phaseStart[k] + 1} à ${EVENT.phaseStart[k + 1] || EVENT.nw}`).join('\n');
  return `Tu es coach sportif. Prépare un plan d'entraînement détaillé, semaine par semaine, pour cette course :

ÉVÉNEMENT : ${EVENT.name}, le ${EVENT.dateLabel}. ${EVENT.description || ''}

CALENDRIER FIXE (ces dates ne changent pas) :
${phasesTxt}
La semaine ${EVENT.nw} est la semaine de course, je la gère déjà séparément — génère uniquement le contenu des semaines ${startIdx + 1} à ${EVENT.nw - 1}.

PROFIL DE LA PERSONNE :
- Âge : ${p.ageRange} · Niveau d'activité actuel : ${p.activityLevel}
- Sports pratiqués actuellement : ${sportsTxt}
- Expérience de courses d'endurance : ${a.pastEndurance}
- Blessures / limites à prendre en compte (reste privé, ne jamais partager avec d'autres) : ${injTxt}
- Aujourd'hui, plus longue durée de course sans s'arrêter : ${a.longest} min
- Km courus par semaine actuellement : ${a.weeklyKm} km
- Endurance/cardio ressenti : ${a.enduranceLevel} · Force haut du corps : ${a.upperBodyLevel} · Force jambes : ${a.legsLevel} · Grip/équilibre/escalade : ${a.gripLevel}
- Jours d'entraînement disponibles par semaine : ${a.maxDays} MAXIMUM — ce n'est pas un nombre fixe, adapte le nombre réel de séances selon la phase et la charge (par exemple moins en début de préparation ou en semaine allégée, jusqu'à ce maximum au pic).
- Temps disponible par séance : ${p.sessionDuration ? p.sessionDuration + ' min' : 'pas de préférence précisée'}
- Contraintes : ${p.constraints || 'aucune précisée'}

CE QUE J'ATTENDS :
- Une vraie progression personnalisée, pas un programme générique : si la personne est sédentaire ou débutante, démarre doucement et progresse prudemment (pas de saut brutal de volume). Si une pratique actuelle couvre déjà une partie de la préparation (ex. musculation, escalade, vélo), n'en rajoute pas une version redondante par-dessus — adapte ou remplace.
- Jamais plus de ${a.maxDays} séances sur une même semaine, sur des jours différents (Lun/Mar/Mer/Jeu/Ven/Sam/Dim). RÈGLE STRICTE sur la fréquence, pas seulement la durée : la semaine 1 doit démarrer à AU MOINS 2 séances de moins que ${a.maxDays} (minimum 3 séances au tout début, jamais le maximum direct dès le départ, même si la personne se dit "sportif confirmé"). Ajoute une séance supplémentaire progressivement au fil des semaines, et n'atteins ${a.maxDays} séances que plus tard dans la préparation (pas avant le milieu de la phase Volume, sauf si ${a.maxDays} est déjà bas, 3 ou moins). La fréquence est une vraie variable de progression, au même titre que la durée — ne te contente jamais d'augmenter seulement la durée des séances à nombre de séances fixe.
- Marque les semaines de récupération/allégées que tu juges utiles ("rec": true).
- Séances de course réalistes et progressives ; séances de renfo avec des exercices concrets adaptés au niveau réel de la personne, pas un texte générique.

RÉPONDS UNIQUEMENT avec un bloc de code JSON, un objet par semaine, dans ce format exact :
[
  {"i": ${startIdx}, "rec": false, "sessions": [
    {"day": "Mar", "type": "course", "title": "Sortie facile", "desc": "Description concrète de la séance", "min": 30, "run": true},
    {"day": "Jeu", "type": "renfo", "title": "...", "desc": "...", "min": 25, "run": false}
  ]},
  ...
]
("i" = numéro de semaine en partant de 0, de ${startIdx} à ${EVENT.nw - 2} inclus. "run": true seulement pour les séances qui comptent dans le volume de course hebdomadaire.)`;
}

function doneByWeek() { const o = {}; PLAN.forEach(w => { const m = weekStats(w).m; if (m) o[w.i] = m; }); return o; }

function planView() {
  let h = `<div class="card"><h3>Profil de la prépa</h3><p class="note" style="margin:4px 0 8px">Volume de course par semaine, jusqu'au départ.</p>${chart(PLAN, doneByWeek(), cur)}</div>`;
  let lastPh = 0;
  h += '<div class="wlist">';
  PLAN.forEach(w => {
    if (w.ph !== lastPh) { lastPh = w.ph; h += `<div class="phase">${EVENT.phases[w.ph - 1]}</div>`; }
    const st = weekStats(w);
    h += `<button data-act="jump" data-i="${w.i}" class="${w.i === cur ? 'cur' : ''}"><span>S${w.i + 1} · ${fd(w.start)}${w.rec ? ' · allégée' : ''}${w.light ? ' · −20 %' : ''}</span><span class="mut">${w.before ? 'avant ton départ' : (st.n ? hm(st.m) + ' / ' : '') + hm(w.target)}</span></button>`;
  });
  return h + '</div>';
}

function athStats(d) {
  const pl = d.plan || [], done = {}; let tot = 0;
  Object.entries(d.weeks || {}).forEach(([i, w]) => { done[i] = w.m; tot += w.m; });
  return {pl, done, tot};
}
function grpView() {
  let h = `<div class="top" style="padding-bottom:0"><div><h1>Le groupe</h1></div></div>`;
  if (!Store.ok) return h + `<div class="card note">La vue de groupe nécessite d'ouvrir cette app avec ton compte Claude, après avoir été invité par le créateur de l'app. Tes entraînements restent enregistrés sur ton téléphone en attendant.</div>`;
  if (!Store.canWrite) h += `<div class="card note">Tu peux consulter le groupe, mais ton niveau d'accès ne permet pas de partager tes données.</div>`;
  if (!S.share) h += `<div class="card note">Tu ne partages pas tes données. Active le partage dans l'onglet Moi pour apparaître ici.</div>`;
  if (!GROUP.length) return h + `<div class="card note">Personne n'a encore partagé son plan.</div>`;
  GROUP.slice().sort((a, b) => (a.data.name || '').localeCompare(b.data.name || '')).forEach(g => {
    const d = g.data; if (!d.plan || !d.plan.length) return;
    const a = athStats(d), me = g.id === Store.uid, wk = (d.weeks || {})[cur] || {m:0, n:0, t:0};
    const pw = a.pl[cur], open = gOpen === g.id;
    h += `<div class="card ath"><h3>${esc(d.name || 'Anonyme')}${me ? ' <span class="chip soft">toi</span>' : ''}</h3>
      <div class="mini"><span>Semaine ${cur + 1} · ${EVENT.phases[phaseOf(cur) - 1]}</span><span>${wk.n || 0}/${pw.sessions.length} séances</span><span>${hm(wk.m)} / ${hm(pw.target)}</span><span>Total ${hm(a.tot)}</span></div>
      <div class="bar"><i style="width:${pw.target ? Math.min(100, Math.round(100 * (wk.m || 0) / pw.target)) : 0}%"></i></div>
      <div class="row"><button class="btn alt" data-act="gopen" data-id="${g.id}">${open ? 'Masquer' : 'Voir son programme'}</button></div>`;
    if (open) {
      const gw = a.pl[gWeek];
      if (d.fullName) h += `<p class="note" style="margin:0 0 8px">${esc(d.fullName)}</p>`;
      h += chart(a.pl, a.done, cur);
      h += `<div class="wknav"><button data-act="gwk" data-d="-1" aria-label="Semaine précédente">‹</button><div class="mid"><b>Semaine ${gWeek + 1}</b><div class="note">${fd(gw.start)} – ${fd(gw.end)}</div></div><button data-act="gwk" data-d="1" aria-label="Semaine suivante">›</button></div>`;
      if (!gw.sessions.length) h += '<p class="note">Pas de séances cette semaine.</p>';
      gw.sessions.forEach(s => {
        const l = (d.ses || {})[s.id];
        h += `<div class="ses ${l ? 'done' : ''}"><div class="hd"><div class="chk" style="display:flex;align-items:center;justify-content:center">✓</div><div class="ti"><b>${esc(s.title)}</b><span>${s.day} · ${s.min ? hm(s.min) + ' prévu' : 'course'}${l ? ' · fait : ' + hm(l.m) + (l.k ? ', ' + l.k + ' km' : '') + (l.d ? ', ' + l.d + ' m D+' : '') : ''}</span></div></div></div>`;
      });
    }
    h += '</div>';
  });
  return h;
}

function moiView() {
  const P = S.profile, E = ev();
  const profileCard = (E && E.plan)
    ? `<div class="card"><b>${esc(P.name)}</b>${P.fullName ? ` <span class="note">${esc(P.fullName)}</span>` : ''}<p class="note" style="margin:4px 0 0">${E.assess.maxDays} jours max par semaine · départ du plan : semaine ${E.startIdx + 1}</p>
      <p class="note" style="margin:8px 0 0">Série en cours : ${streak()} semaine${streak() > 1 ? 's' : ''} à 75 % de séances faites ou plus.</p>
      <div class="row"><button class="btn alt" data-act="editProfile">Modifier mon profil</button><button class="btn alt" data-act="editEvent">Modifier mon évaluation ${esc(EVENT.shortName)}</button><button class="btn alt" data-act="genPlan">Régénérer mon plan avec Claude</button></div></div>`
    : `<div class="card"><b>${esc(P.name)}</b>${P.fullName ? ` <span class="note">${esc(P.fullName)}</span>` : ''}<p class="note" style="margin:8px 0 0">Tu n'as pas encore choisi d'objectif.</p>
      <div class="row"><button class="btn alt" data-act="editProfile">Modifier mon profil</button></div></div>
      ${eventsDashboard()}`;
  return `<div class="top" style="padding-bottom:0"><div><h1>Moi</h1></div></div>
  ${profileCard}
  <div class="card"><b>Partage avec le groupe</b><p class="note" style="margin:4px 0 8px">Le groupe de l'Ultra Morzine voit ton pseudo (et ton nom complet si tu l'as renseigné), ton plan Morzine, tes séances faites, durées, km et D+ — tes autres courses restent privées. Jamais tes douleurs, fatigue, notes ni limites.</p>
  <div class="row"><button class="btn ${S.share ? '' : 'alt'}" data-act="share">${S.share ? 'Partage activé · désactiver' : 'Partage désactivé · activer'}</button></div></div>
  <div class="card"><b>Sauvegarde</b><p class="note" style="margin:4px 0 8px">Copie tes données pour les conserver ou les restaurer.</p>
  <div class="row"><button class="btn alt" data-act="export">Exporter</button><button class="btn alt" data-act="import">Importer</button></div></div>
  <div class="card"><b>Recommencer</b><p class="note" style="margin:4px 0 8px">Efface tout (profil, course choisie, séances) pour repartir de zéro sur cet appareil.</p>
  <div class="row"><button class="btn alt" data-act="reset" style="color:var(--warn);border-color:var(--warn)">Réinitialiser</button></div></div>`;
}

function render() {
  const y = window.scrollY, app = $('#app'), nav = $('#nav');
  if (!S.profile) { app.innerHTML = onboardProfile(false); nav.hidden = true; return; }
  if (tab === 'editProfile') { app.innerHTML = onboardProfile(true); nav.hidden = true; return; }

  const chosen = syncActiveEvent();

  if (tab === 'addEvent') { app.innerHTML = eventSearchForm(); nav.hidden = true; return; }
  if (tab === 'editEvent' && chosen) { app.innerHTML = onboardEvent(true); nav.hidden = true; return; }
  if (chosen && !ev().assess) { app.innerHTML = onboardEvent(false); nav.hidden = true; return; }
  if ((tab === 'genPlan' && chosen) || (chosen && !ev().plan)) { app.innerHTML = genPlanView(); nav.hidden = true; return; }

  const ready = chosen && ev() && ev().plan;
  let v;
  if (tab === 'sem') v = ready ? semView() : eventsDashboard();
  else if (tab === 'plan') v = ready ? planView() : eventsDashboard();
  else if (tab === 'grp') v = grpView();
  else v = moiView();
  app.innerHTML = eventSwitcherRow() + (ready ? head() : dashHead()) + v;
  nav.hidden = false;
  nav.innerHTML = [['sem','Semaine'],['plan','Plan'],['grp','Groupe'],['moi','Moi']].map(([k, t]) => `<button data-act="tab" data-v="${k}" class="${tab === k ? 'on' : ''}">${t}</button>`).join('');
  window.scrollTo(0, y);
}

/* ============ Fenêtres ============ */
function showModal(title, text, importMode) {
  $('#modal').innerHTML = `<div class="modal" data-act="closeBg"><div role="dialog" aria-label="${esc(title)}"><h3 style="margin-bottom:8px">${esc(title)}</h3><textarea id="mtxt" ${importMode ? 'placeholder="Colle ici tes données exportées"' : 'readonly'}>${esc(text)}</textarea>
  <div class="row"><button class="btn" data-act="${importMode ? 'doImport' : 'copyTxt'}">${importMode ? 'Importer' : 'Copier'}</button><button class="btn alt" data-act="closeModal">Fermer</button></div><p class="note" id="mmsg"></p></div></div>`;
  if (!importMode) { const t = $('#mtxt'); t.focus(); t.select(); }
}
function feedbackText() {
  const w = PLAN[vw], st = weekStats(w);
  let t = `Retour semaine ${vw + 1} (${fd(w.start)} – ${fd(w.end)}) · phase ${EVENT.phases[w.ph - 1]}${w.rec ? ' (allégée)' : ''}${w.light ? ' (−20 %)' : ''}\n`;
  t += `Course : ${hm(st.m)} faites sur ${hm(w.target)} prévues · séances ${st.n}/${st.t} · ${Math.round(st.k * 10) / 10} km · ${Math.round(st.d)} m D+\n`;
  if (st.fat) t += `Fatigue moyenne ${st.fat.toFixed(1)}/10`;
  if (st.rpe) t += ` · effort moyen ${st.rpe.toFixed(1)}/10`;
  t += '\n\nDétail :\n';
  const pains = [], notes = [];
  w.sessions.forEach(s => {
    const l = ev().log[s.id] || {};
    t += `- ${s.day} ${s.title} : ${l.done ? 'fait' + (l.min ? ', ' + l.min + ' min' : '') + (l.km ? ', ' + l.km + ' km' : '') + (l.dplus ? ', ' + l.dplus + ' m D+' : '') + (l.rpe ? ', effort ' + l.rpe + '/10' : '') : 'non fait'}\n`;
    if (l.pain && l.pain.trim()) pains.push(`${s.day} : ${l.pain.trim()}`);
    if (l.note && l.note.trim()) notes.push(`${s.day} : ${l.note.trim()}`);
  });
  t += `\nDouleurs : ${pains.length ? pains.join(' ; ') : 'aucune'}\n`;
  if (notes.length) t += `Notes : ${notes.join(' ; ')}\n`;
  if (S.profile.limits && S.profile.limits.trim()) t += `Limite connue : ${S.profile.limits.trim()}\n`;
  t += `\nPeux-tu ajuster ma semaine ${vw + 2} ?`;
  return t;
}

/* ============ Événements ============ */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'closeBg') { if (e.target === b) $('#modal').innerHTML = ''; return; }
  if (a === 'closeModal') { $('#modal').innerHTML = ''; return; }
  if (a === 'copyTxt') {
    const t = $('#mtxt'); t.select();
    let ok = false; try { await navigator.clipboard.writeText(t.value); ok = true; } catch (er) { try { ok = document.execCommand('copy'); } catch (e2) {} }
    $('#mmsg').textContent = ok ? 'Copié.' : 'Sélectionne le texte et copie-le manuellement.'; return;
  }
  if (a === 'doImport') {
    try {
      const d = JSON.parse($('#mtxt').value);
      if (!d || !d.profile || !d.profile.name) throw 0;
      S = {v:2, profile:d.profile, events:d.events || {}, customEvents:d.customEvents || {}, viewEventId:d.viewEventId || null, share:d.share !== false, updated:0};
      syncActiveEvent(); rebuild(); persist(); $('#modal').innerHTML = ''; tab = 'sem'; render();
    } catch (er) { $('#mmsg').textContent = 'Données invalides.'; }
    return;
  }
  if (a === 'saveProfile') {
    const name = $('#f-name').value.trim();
    if (!name) { $('#f-name').focus(); return; }
    const injuryAreas = Array.from(document.querySelectorAll('[data-inj]:checked')).map(c => c.value);
    let sports = []; try { sports = JSON.parse($('#f-sports-json').value || '[]'); } catch (e) {}
    const p = {
      name, fullName:$('#f-fullname').value.trim(), ageRange:$('#f-age').value, activityLevel:$('#f-activity').value, sports,
      injuryAreas, limits:$('#f-limits').value,
      sessionDuration:$('#f-dur').value, constraints:$('#f-constraints').value
    };
    S.profile = p; rebuild(); persist(); tab = 'sem'; render(); return;
  }
  if (a === 'saveEvent') {
    const E = ensureEvent();
    E.assess = {
      pastEndurance:$('#f-past').value, longest:+$('#f-longest').value, weeklyKm:+$('#f-km').value,
      enduranceLevel:$('#f-end').value, upperBodyLevel:$('#f-up').value, legsLevel:$('#f-legs').value, gripLevel:$('#f-grip').value,
      maxDays:+$('#f-maxdays').value
    };
    rebuild(); persist(); tab = 'sem'; vw = Math.max(cur, E.startIdx); render(); return;
  }
  if (a === 'pickEvent') {
    const id = b.dataset.id; if (!setActiveEvent(id)) return;
    ensureEvent(); S.viewEventId = id; cur = weekOf(new Date()); vw = cur;
    persist(); tab = 'sem'; render(); return;
  }
  if (a === 'switchEvent') { S.viewEventId = b.dataset.id; persist(); tab = 'sem'; render(); return; }
  if (a === 'addEvent') { tab = 'addEvent'; render(); return; }
  if (a === 'copyEventSearch') {
    const name = $('#f-evt-name').value.trim();
    if (!name) { $('#f-evt-name').focus(); return; }
    showModal('Recherche pour Claude', eventLookupPrompt(name), false); return;
  }
  if (a === 'createEvent') {
    const msg = $('#evtMsg');
    try {
      const d = JSON.parse($('#f-evt-json').value);
      if (d.error || !d.name || !d.raceDate) throw 0;
      const race = new Date(d.raceDate);
      if (isNaN(race.getTime())) throw 0;
      const start = mondayOfWeek(new Date());
      const nw = Math.max(4, Math.min(120, Math.round(dayDiff(race, start) / 7) + 1));
      const id = 'evt-' + Date.now().toString(36);
      const dateLabel = race.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});
      const shortName = d.name.length > 22 ? d.name.slice(0, 20) + '…' : d.name;
      S.customEvents[id] = {
        id, name: d.name, shortName, dateLabel,
        finishLabel: 'Arrivée · ' + fd(race),
        start: start.toISOString().slice(0, 10), race: d.raceDate,
        nw, phases: ['Base','Volume','Spécifique','Pic','Affûtage'], phaseStart: scalePhases(nw),
        recommendedDays: d.distanceKm ? `Pour ${d.name} (${d.distanceKm} km${d.elevationM ? ', ' + d.elevationM + ' m D+' : ''}), adapte le nombre de jours à l'intensité de l'épreuve.` : '',
        description: [d.description, d.distanceKm ? d.distanceKm + ' km' : '', d.elevationM ? d.elevationM + ' m D+' : '', d.location].filter(Boolean).join(' · '),
        raceSession: {title: d.name, desc: `Jour J. ${d.description || ''} Pars prudent, fais confiance à ta préparation.`}
      };
      setActiveEvent(id); ensureEvent(); S.viewEventId = id; cur = weekOf(new Date()); vw = cur;
      persist(); tab = 'sem'; render();
    } catch (er) { if (msg) msg.textContent = "Le texte collé n'est pas reconnu. Vérifie que tu as bien copié tout le bloc JSON renvoyé par Claude."; }
    return;
  }
  if (a === 'addSport') {
    const inp = $('#f-sport-input'); addSportValue(inp.value); inp.value = ''; inp.focus(); return;
  }
  if (a === 'rmSport') {
    let arr = []; try { arr = JSON.parse($('#f-sports-json').value || '[]'); } catch (e2) {}
    $('#f-sports-json').value = JSON.stringify(arr.filter(x => x !== b.dataset.sport));
    b.closest('[data-sport-chip]').remove(); return;
  }
  if (a === 'copyPrompt') { showModal('Mes informations pour Claude', planPrompt(), false); return; }
  if (a === 'importPlan') {
    try {
      const parsed = JSON.parse($('#f-plan-json').value);
      const weeksArr = Array.isArray(parsed) ? parsed : parsed.weeks;
      if (!Array.isArray(weeksArr) || !weeksArr.length) throw 0;
      const byIndex = {};
      weeksArr.forEach(w => {
        if (typeof w.i !== 'number' || !Array.isArray(w.sessions)) return;
        const seen = new Set();
        const sessions = w.sessions.filter(s => s && s.day && !seen.has(s.day) && seen.add(s.day)).map(s => ({
          day: s.day, type: String(s.type || 'seance'), title: String(s.title || 'Séance').slice(0, 60),
          desc: String(s.desc || '').slice(0, 400), min: Math.max(0, Math.round(num(s.min))), run: !!s.run
        }));
        byIndex[w.i] = {rec: !!w.rec, sessions};
      });
      if (!Object.keys(byIndex).length) throw 0;
      ev().plan = byIndex;
      rebuild(); persist(); tab = 'sem'; vw = Math.max(cur, ev().startIdx); render();
    } catch (er) {
      const msg = $('#planImportMsg'); if (msg) msg.textContent = "Le texte collé n'est pas reconnu. Vérifie que tu as bien copié tout le bloc JSON renvoyé par Claude.";
    }
    return;
  }
  if (a === 'genPlan') { tab = 'genPlan'; render(); return; }
  if (a === 'editProfile') { tab = 'editProfile'; render(); return; }
  if (a === 'editEvent') { tab = 'editEvent'; render(); return; }
  if (a === 'tab') { tab = b.dataset.v; if (tab === 'grp') ensureGroup(); render(); window.scrollTo(0, 0); return; }
  if (a === 'wk') { vw = Math.max(0, Math.min(EVENT.nw - 1, vw + +b.dataset.d)); openId = null; render(); return; }
  if (a === 'jump') { vw = +b.dataset.i; openId = null; tab = 'sem'; render(); window.scrollTo(0, 0); return; }
  if (a === 'open') { openId = openId === b.dataset.id ? null : b.dataset.id; render(); return; }
  if (a === 'tog') {
    const id = b.dataset.id, L = ev().log, l = L[id] || (L[id] = {});
    l.done = !l.done;
    if (l.done && !l.min) { const s = PLAN[vw].sessions.find(x => x.id === id); if (s && s.min) l.min = s.min; }
    persist(); render(); return;
  }
  if (a === 'apply') { ev().overrides[+b.dataset.i] = .8; rebuild(); persist(); render(); return; }
  if (a === 'undo') { delete ev().overrides[+b.dataset.i]; rebuild(); persist(); render(); return; }
  if (a === 'copy') { showModal('Mon retour de la semaine', feedbackText(), false); return; }
  if (a === 'share') { S.share = !S.share; persist(); render(); return; }
  if (a === 'export') { showModal('Mes données', JSON.stringify({profile:S.profile, events:S.events, customEvents:S.customEvents, viewEventId:S.viewEventId, share:S.share}), false); return; }
  if (a === 'import') { showModal('Importer mes données', '', true); return; }
  if (a === 'reset') {
    if (!confirm('Tout effacer (profil, course, séances) et repartir de zéro sur cet appareil ? Pense à exporter avant si tu veux garder une sauvegarde.')) return;
    try { localStorage.removeItem(KEY); } catch (e) {}
    if ('caches' in window) { try { const ks = await caches.keys(); ks.forEach(k => caches.delete(k)); } catch (e) {} }
    if ('serviceWorker' in navigator) { try { const rs = await navigator.serviceWorker.getRegistrations(); rs.forEach(r => r.unregister()); } catch (e) {} }
    location.reload();
    return;
  }
  if (a === 'gopen') { gOpen = gOpen === b.dataset.id ? null : b.dataset.id; gWeek = cur; render(); return; }
  if (a === 'gwk') { gWeek = Math.max(0, Math.min(EVENT.nw - 1, gWeek + +b.dataset.d)); render(); return; }
});
document.addEventListener('change', e => {
  const f = e.target.dataset && e.target.dataset.f; if (!f) return;
  const L = ev().log, l = L[e.target.dataset.id] || (L[e.target.dataset.id] = {});
  l[f] = e.target.value; persist(); render();
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'f-sport-input' && e.key === 'Enter') {
    e.preventDefault(); addSportValue(e.target.value); e.target.value = '';
  }
});

/* ============ Démarrage ============ */
function ensureGroup() {
  if (groupSub || !Store.ok) return;
  try { groupSub = Store.subscribe(list => { GROUP = list; if (tab === 'grp') render(); }); } catch (e) {}
}
async function boot() {
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
  syncActiveEvent(); rebuild(); if (S.profile && ev()) vw = Math.max(cur, ev().startIdx); render();
  await Store.init();
  if (!Store.ok) return;
  try {
    const r = await Store.loadMine();
    if (r && r.json) {
      const remote = JSON.parse(r.json);
      if ((remote.updated || 0) > (S.updated || 0)) {
        S = remote; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
        syncActiveEvent(); rebuild(); if (S.profile && ev()) vw = Math.max(cur, ev().startIdx); render();
      } else if (S.profile) { dirty = true; flush(); }
    } else if (S.profile) { dirty = true; flush(); }
  } catch (e) {}
  if (tab === 'grp') ensureGroup();
}
boot();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('service-worker.js').catch(() => {}); }
</script>
</body>
