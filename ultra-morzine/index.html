<!doctype html>
<html lang="fr">
<head>

<style>
:root{
  --bg:#ECEEE8; --card:#F7F8F4; --ink:#16252A; --mute:#5C6A68; --line:#D2D8D1;
  --pine:#214C42; --ice:#5E93A8; --lichen:#9FB03A; --warn:#B4452F; --onpine:#F2F5EF;
  --head:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11191B; --card:#1A2427; --ink:#E7EDE8; --mute:#93A29E; --line:#2B393C;
    --pine:#6DB39D; --ice:#7DB0C4; --lichen:#C3D060; --warn:#E3806B; --onpine:#11191B;
  }
}
:root[data-theme="dark"]{
  --bg:#11191B; --card:#1A2427; --ink:#E7EDE8; --mute:#93A29E; --line:#2B393C;
  --pine:#6DB39D; --ice:#7DB0C4; --lichen:#C3D060; --warn:#E3806B; --onpine:#11191B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-bottom:84px}
#app{max-width:560px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--head);font-weight:800;letter-spacing:.01em;margin:0;line-height:1.05}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:20px 0 12px}
.top h1{font-size:30px}
.top .sub{color:var(--mute);font-size:13px}
.count{font-family:var(--head);font-weight:800;font-size:34px;color:var(--pine);text-align:right;line-height:1}
.count small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.wknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
.wknav button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:44px;height:44px;font-size:20px}
.wknav .mid{text-align:center}
.wknav h2{font-size:26px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--pine);color:var(--onpine)}
.chip.soft{background:transparent;border:1px solid var(--line);color:var(--mute)}
.sportchip{display:inline-flex;align-items:center;gap:4px;padding:4px 6px 4px 10px}
.sportchip button{background:none;border:0;color:inherit;font-size:15px;line-height:1;padding:2px;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.kpis b{display:block;font-family:var(--head);font-size:24px;font-weight:800}
.kpis span{font-size:12px;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--lichen)}
.ses{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.ses.done{border-color:var(--pine)}
.ses .hd{display:flex;gap:12px;align-items:center;padding:12px}
.chk{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:transparent;font-size:20px;color:transparent}
.done .chk{background:var(--pine);border-color:var(--pine);color:var(--onpine)}
.ses .ti{flex:1;min-width:0}
.ses .ti b{font-family:var(--head);font-size:21px;font-weight:800;display:block}
.ses .ti span{font-size:13px;color:var(--mute)}
.lnk{background:none;border:0;color:var(--ice);font-weight:600;padding:8px}
.ses p{margin:0;padding:0 14px 12px;color:var(--mute);font-size:14px}
.form{border-top:1px solid var(--line);padding:12px 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label,.fld label{font-size:12px;color:var(--mute);display:block;margin-bottom:3px}
.form .full{grid-column:1/-1}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
textarea{min-height:70px;resize:vertical}
.priv{font-size:11px;color:var(--warn)}
.note{color:var(--mute);font-size:14px}
.warnbox{border:1px solid var(--warn);border-radius:14px;padding:12px;margin:12px 0;background:var(--card)}
.warnbox b{color:var(--warn)}
.btn{display:inline-block;border:0;border-radius:12px;background:var(--pine);color:var(--onpine);font-weight:600;padding:12px 16px;min-height:44px}

.wlist button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;min-height:44px}

<body>
<div id="app"></div>
<nav class="tabs" id="nav" hidden></nav>
<div id="modal"></div>
<script>
/* ============ Config de l'événement (tout ce qui est spécifique à CETTE course) ============ */
/* Un profil sportif (générique) peut un jour préparer plusieurs événements comme celui-ci.
   Pour l'instant un seul événement actif, mais tout ce qui lui est propre reste ici. */
const EVENT = {
  id: 'ultra-morzine-2027',
  name: 'Ultra Spartan Morzine-Avoriaz',
  shortName: 'Ultra Morzine',
  dateLabel: '2 juillet 2027',
  finishLabel: 'Nyon · 2 juil.',
  start: new Date(2026, 9, 5),   // lundi 5 octobre 2026
  race:  new Date(2027, 6, 2),   // vendredi 2 juillet 2027
  nw: 39, peakW: 35,
  phases: ['Base','Volume','Spécifique','Pic','Affûtage'],
  phaseStart: [0,10,21,30,36],
  caps: {1:90,2:150,3:240,4:300,5:150},
  layout: {
    3:[['Mar','run'],['Jeu','str'],['Sam','long']],
    4:[['Lun','str'],['Mar','run'],['Jeu','q'],['Sam','long']],
    5:[['Lun','str'],['Mar','run'],['Mer','str2'],['Jeu','q'],['Sam','long']],
    6:[['Lun','str'],['Mar','run'],['Mer','str2'],['Jeu','q'],['Sam','long'],['Dim','b2b']]
  },
  raceSession: {title:'ULTRA SPARTAN 50K', desc:`Jour J à Morzine-Avoriaz. 50 km, 60 obstacles. Pars prudent, bois et mange tôt.`}
};
const DAYS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const KEY = 'ultra-morzine-v2';

/* Liste de suggestions pour "quels sports pratiques-tu" — l'utilisateur peut aussi taper autre chose. */
const SPORTS_LIST = ['Course à pied','Trail','Triathlon','Duathlon','Natation','Cyclisme / Vélo','VTT','Musculation','CrossFit',
  'Haltérophilie','Football','Rugby','Handball','Basketball','Volleyball','Tennis','Badminton','Squash','Tennis de table',
  'Boxe','Judo','Karaté','Taekwondo','MMA','Lutte','Jiu-jitsu brésilien','Escalade','Ski alpin','Ski de fond','Snowboard',
  'Randonnée','Alpinisme','Golf','Aviron','Kayak / Canoë','Voile','Planche à voile','Surf','Plongée','Équitation','Danse',
  'Yoga','Pilates','Gymnastique','Escrime','Tir à l\'arc','Roller','Skateboard','Patinage','Hockey sur glace','Pétanque',
  'Cricket','Baseball','Water-polo','Parkour','Fitness / Aérobic'];
/* Classe les sports tapés en grandes familles utiles pour adapter les séances de renfo. Correspondances simples par mot-clé. */
function classifySports(list) {
  const low = (list || []).map(s => s.toLowerCase());
  const has = kws => low.some(s => kws.some(k => s.includes(k)));
  return {
    muscu: has(['musculation','crossfit','haltérophilie','powerlifting','force athlétique','fitness']),
    grip: has(['escalade','grimpe','bloc']),
    combat: has(['boxe','judo','karaté','karate','mma','lutte','taekwondo','jiu-jitsu','jjb','kickboxing','kick-boxing'])
  };
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm = m => { m = Math.round(m || 0); const h = Math.floor(m/60), r = m % 60; return h ? h + 'h' + String(r).padStart(2,'0') : r + ' min'; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fd = d => d.toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const dayDiff = (a, b) => Math.round((midnight(a) - midnight(b)) / 864e5);
const weekOf = d => Math.max(0, Math.min(EVENT.nw-1, Math.floor(dayDiff(d, EVENT.start) / 7)));
const phaseOf = i => { let p = 1; EVENT.phaseStart.forEach((s, k) => { if (i >= s) p = k + 1; }); return p; };
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const sportChipHtml = s => `<span class="chip soft sportchip" data-sport-chip="${esc(s)}">${esc(s)} <button type="button" data-act="rmSport" data-sport="${esc(s)}" aria-label="Retirer ${esc(s)}">×</button></span>`;
function addSportValue(v) {
  v = (v || '').trim(); if (!v) return;
  const hid = $('#f-sports-json'); if (!hid) return;
  let arr = []; try { arr = JSON.parse(hid.value || '[]'); } catch (e) {}
  if (arr.some(x => x.toLowerCase() === v.toLowerCase())) return;
  arr.push(v); hid.value = JSON.stringify(arr);
  $('#sportChips').insertAdjacentHTML('beforeend', sportChipHtml(v));
}

/* ============ Générateur de plan ============ */
function mk(type, ph, min, flags) {
  flags = flags || {};
  let title, desc, run = ['run','q','long','b2b'].includes(type);
  const dp = r => Math.round(min * r / 50) * 50;
  switch (type) {
    case 'run':
      title = 'Course facile';
      desc = `Allure où tu peux parler. Marche autorisée.${ph >= 2 ? ' Terrain vallonné si possible.' : ''}`;
      break;
    case 'q':
      if (ph === 1) { title = 'Course facile'; desc = 'Allure conversationnelle. Alterne course et marche si besoin.'; }
      else if (ph === 2) { title = 'Côtes'; desc = `15 min d'échauffement facile, 6 à 8 × 1 min en montée soutenue (redescente en récupération), puis retour au calme.`; }
      else if (ph === 3) { title = 'Côtes longues'; desc = `Échauffement, puis 4 à 6 × 3-4 min en montée (course ou marche rapide), récupération en descente.`; }
      else if (ph === 4) { title = 'Allure course'; desc = `Blocs de 20-30 min à l'allure que tu tiendras le jour J, en terrain vallonné, avec ton sac.`; }
      else { title = 'Allure course courte'; desc = `Échauffement, 3 × 8 min à allure course, retour au calme. Reste frais.`; }
      break;
    case 'long':
      if (ph === 1) { title = 'Sortie longue facile'; desc = `Alterne course et marche (ex. 4 min / 1 min), allure très tranquille. Le but : durer.`; }
      else if (ph === 2) { title = 'Sortie longue vallonnée'; desc = `Allure facile, terrain varié. Repère : environ ${dp(5)} m de D+.`; }
      else if (ph === 3) { title = 'Sortie longue montagne'; desc = `Repère : environ ${dp(8)} m de D+. Teste ton sac, tes vêtements et ton ravitaillement.`; }
      else if (ph === 4) { title = 'Grande sortie'; desc = `Répétition générale : environ ${dp(10)} m de D+, sac chargé, nutrition de course. Marche les pentes raides.`; }
      else { title = 'Sortie facile'; desc = `Tranquille, pour garder les jambes. Repère : environ ${dp(4)} m de D+.`; }
      break;
    case 'b2b':
      if (ph >= 3) { title = 'Enchaînement J+1'; desc = `Deuxième jour de fatigue : rando-course facile en montagne, sac chargé.`; }
      else { title = 'Récup active'; desc = `Footing très facile ou marche active.`; }
      break;
    case 'str':
      if (flags.muscu) { title = 'Renfo (ta séance habituelle)'; desc = `Tu pratiques déjà la musculation : garde ta séance habituelle, ajoute juste 2-3 exercices de grip (suspension, port de charge) pour préparer les obstacles.`; }
      else if (ph === 1) { title = 'Street workout'; desc = `Tractions, dips, pompes, tractions australiennes + gainage. Garde 2 répétitions en réserve.`; }
      else if (ph === 2) { title = 'Street workout + jambes'; desc = `Haut du corps allégé, puis fentes, squat bulgare, mollets. Les jambes préparent la montagne.`; }
      else if (ph === 3) { title = 'Street workout (maintien)'; desc = `Volume réduit d'environ un tiers pour garder de la fraîcheur à la course. Gainage.`; }
      else { title = 'Maintien léger'; desc = `Séance courte : quelques séries de tractions, pompes, gainage. Rien d'épuisant.`; }
      break;
    case 'str2':
      if (flags.grip) { title = 'Renfo complémentaire'; desc = `L'escalade couvre déjà bien ton grip et ton équilibre : concentre-toi ici sur les portés de charge (sac de sable, bidon) et la corde.`; }
      else if (flags.combat) { title = 'Renfo complémentaire'; desc = `Ton sport de combat couvre déjà l'explosivité et le cardio intense : ajoute ici du grip (suspensions, farmer carry) pour les obstacles.`; }
      else if (ph === 1) { title = 'Kettlebell & mobilité'; desc = `Swing, goblet squat, mobilité hanches et chevilles.`; }
      else if (ph === 2) { title = 'Renfo jambes & mobilité'; desc = `Kettlebell : squat, fentes, soulevé de terre roumain, puis mobilité.`; }
      else if (ph === 3) { title = 'OCR spécifique'; desc = `Grip (suspensions, farmer carry), portés (sac de sable, seau), corde, barres de singe.`; }
      else if (ph === 4) { title = 'OCR spécifique léger'; desc = `Grip et portés à charge modérée. Qualité avant quantité.`; }
      else { title = 'Mobilité'; desc = `Mobilité et activation, 20-25 min.`; }
      break;
    case 'mob': title = 'Mobilité & activation'; desc = `20 min de mobilité, quelques accélérations douces.`; break;
    case 'race': title = EVENT.raceSession.title; desc = EVENT.raceSession.desc; break;
  }
  return {title, desc, run};
}

function buildPlan(P, ov, flags) {
  ov = ov || {}; flags = flags || {};
  const weeks = [];
  for (let i = 0; i < EVENT.nw; i++) {
    const ph = phaseOf(i), start = addDays(EVENT.start, i * 7);
    const before = i < P.startIdx;
    let T = 0, rec = false;
    if (!before) {
      if (i <= EVENT.peakW) {
        const span = Math.max(1, EVENT.peakW - P.startIdx);
        T = P.startMin * Math.pow(P.peakMin / P.startMin, (i - P.startIdx) / span);
        if ((i - P.startIdx) % 4 === 3 && i < EVENT.peakW) { T *= .75; rec = true; }
      } else if (i === EVENT.peakW + 1) T = P.peakMin * .7;
      else if (i === EVENT.peakW + 2) T = P.peakMin * .5;
    }
    let light = false;
    if (ov[i]) { T *= ov[i]; light = true; }
    let sessions = [];
    if (!before) {
      if (i === EVENT.nw - 1) {
        sessions = [['Mar','run',25],['Mer','mob',20],['Ven','race',0]].map(([d,t,m]) => ({...mk(t,5,m,flags), id:i+'-'+d, day:d, type:t, min:m}));
        sessions[0].run = true;
      } else {
        const lay = EVENT.layout[P.days] || EVENT.layout[4];
        const W = {long:.45, q:.25, run:.2, b2b:.12};
        const sum = lay.reduce((a, [d, t]) => a + (W[t] || 0), 0);
        sessions = lay.map(([d, t]) => {
          let min;
          if (W[t]) {
            min = T * W[t] / sum;
            if (t === 'long') min = Math.min(min, EVENT.caps[ph]);
            min = Math.max(15, Math.round(min / 5) * 5);
          } else min = ph >= 4 ? 30 : 45;
          return {...mk(t, ph, min, flags), id:i+'-'+d, day:d, type:t, min};
        });
      }
    }
    const target = sessions.filter(s => s.run).reduce((a, s) => a + s.min, 0);
    weeks.push({i, ph, start, end:addDays(start, 6), before, rec, light, sessions, target});
  }
  return weeks;
}

function paramsFrom(days, assess, startIdx) {
  const startMin = Math.max(60, Math.min(240, Math.round(Math.max(assess.weeklyKm * 7, assess.longest * 2.3) / 5) * 5));
  const peakMin = startMin >= 150 ? 540 : startMin >= 100 ? 500 : 450;
  return {days, startMin, peakMin, startIdx};
}

/* ============ État & stockage ============ */
let S = {v:2, profile:null, events:{}, share:true, updated:0};
let PLAN = [], tab = 'sem', cur = weekOf(new Date()), vw = cur, openId = null;
let GROUP = [], gOpen = null, gWeek = cur, groupSub = null, lastSum = '';

// Progression sur l'événement courant (séances faites, semaines allégées...).
// Séparée du profil sportif : un même profil pourra un jour suivre plusieurs événements.
function ev() {
  if (!S.events[EVENT.id]) S.events[EVENT.id] = {startIdx: Math.min(33, weekOf(new Date())), overrides:{}, log:{}};
  return S.events[EVENT.id];
}
function rebuild() { PLAN = (S.profile && ev().assess) ? buildPlan(paramsFrom(S.profile.days, ev().assess, ev().startIdx), ev().overrides, classifySports(S.profile.sports)) : []; }

const Store = {
  ok:false, uid:null, db:null, canWrite:true,
  async init() {
    try {
      if (typeof claude === 'undefined') return;
      const u = await claude.use('user');
      this.uid = u ? await u.id() : null;
      if (u) { const c = await u.can('data.write'); this.canWrite = c !== false; }
      this.db = await claude.use('db');
    } catch (e) { this.db = null; }
    this.ok = !!(this.db && this.uid);
  },
  mineRef() { return this.db.doc('data/users/' + this.uid + '/app'); },
  async loadMine() { const s = await this.mineRef().get(); return s.exists ? s.data() : null; },
  async saveMine(state) { await this.mineRef().set({json: JSON.stringify(state), updated: state.updated}); },
  async publish(sum) { const ref = this.db.doc('athletes/' + this.uid); if (sum) await ref.set(sum); else await ref.delete(); },
  subscribe(cb) { return this.db.collection('athletes').onSnapshot(s => cb(s.docs.map(d => ({id:d.id, data:d.data()}))), () => {}); }
};

let saveT = null, saving = false, dirty = false;
function persist() {
  S.updated = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  dirty = true; clearTimeout(saveT); saveT = setTimeout(flush, 900);
}
async function flush() {
  if (saving || !dirty || !Store.ok) return;
  saving = true; dirty = false;
  try {
    await Store.saveMine(S);
    if (Store.canWrite && S.profile) {
      const sum = S.share ? summary() : null;
      const str = sum ? JSON.stringify({...sum, upd:0}) : 'off';
      if (str !== lastSum) { await Store.publish(sum); lastSum = str; }
    }
  } catch (e) {}
  saving = false; if (dirty) flush();
}

function summary() {
  const E = ev(), P = paramsFrom(S.profile.days, E.assess, E.startIdx), weeks = {}, ses = {};
  PLAN.forEach(w => {
    let m = 0, k = 0, d = 0, n = 0;
    w.sessions.forEach(s => {
      const l = E.log[s.id];
      if (l && l.done) {
        n++; const mm = num(l.min) || s.min;
        if (s.run) { m += mm; k += num(l.km); d += num(l.dplus); }
        ses[s.id] = {m:mm, k:num(l.km), d:num(l.dplus)};
      }
    });
    if (n) weeks[w.i] = {m, k:Math.round(k * 10) / 10, d, n, t:w.sessions.length};
  });
  return {name:S.profile.name, fullName:S.profile.fullName || '', p:P, o:E.overrides, weeks, ses, upd:Date.now()};
}

/* ============ Calculs ============ */
function weekStats(w) {
  let m = 0, k = 0, d = 0, n = 0, fa = [], rp = [], L = ev().log;
  w.sessions.forEach(s => {
    const l = L[s.id] || {};
    if (l.done) {
      n++;
      if (s.run) { m += num(l.min) || s.min; k += num(l.km); d += num(l.dplus); }
    }
    if (l.fat) fa.push(+l.fat);
    if (l.rpe) rp.push(+l.rpe);
  });
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
  return {m, k, d, n, t:w.sessions.length, fat:avg(fa), rpe:avg(rp)};
}
function advice(i) {
  const E = ev();
  if (!S.profile || i <= E.startIdx || i - 1 > cur || E.overrides[i]) return null;
  const pw = PLAN[i - 1]; if (!pw.sessions.length) return null;
  let pain = false;
  pw.sessions.forEach(s => { const l = E.log[s.id]; if (l && l.pain && l.pain.trim()) pain = true; });
  const st = weekStats(pw), why = [];
  if (st.fat >= 8) why.push('fatigue moyenne élevée (' + st.fat.toFixed(1) + '/10)');
  if (pain) why.push('douleur signalée');
  if (st.t && st.n / st.t < .5) why.push('moins de la moitié des séances faites');
  return why.length ? why : null;
}
function streak() {
  let c = 0;
  for (let i = cur - 1; i >= ev().startIdx; i--) {
    const st = weekStats(PLAN[i]);
    if (st.t && st.n / st.t >= .75) c++; else break;
  }
  return c;
}

/* ============ Graphique : profil de montagne ============ */
function chart(plan, doneBy, curW) {
  const W = 360, bx = 10, bw = 340, base = 142, top = 20;
  const mx = Math.max(60, ...plan.map(w => w.target), ...Object.values(doneBy));
  const X = i => bx + bw * i / (EVENT.nw - 1), Y = v => base - (v / mx) * (base - top);
  let line = '';
  plan.forEach((w, i) => { line += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(w.target).toFixed(1); });
  const area = line + `L${X(EVENT.nw-1).toFixed(1)} ${base}L${X(0).toFixed(1)} ${base}Z`;
  let bars = '', lab = '';
  plan.forEach((w, i) => { const v = doneBy[i]; if (v) bars += `<rect x="${(X(i)-2.8).toFixed(1)}" y="${Y(v).toFixed(1)}" width="5.6" height="${(base-Y(v)).toFixed(1)}" rx="1.5" fill="var(--lichen)"/>`; });
  EVENT.phaseStart.forEach((s, k) => {
    lab += `<line x1="${X(s).toFixed(1)}" x2="${X(s).toFixed(1)}" y1="${top-6}" y2="${base}" stroke="var(--line)" stroke-dasharray="2 3"/>`;
    lab += `<text x="${(X(s)+3).toFixed(1)}" y="${base+14}" font-size="9.5" fill="var(--mute)">${EVENT.phases[k]}</text>`;
  });
  const cx = X(curW).toFixed(1);
  return `<svg viewBox="0 0 ${W} 166" role="img" aria-label="Volume de course par semaine, prévu et réalisé">
    ${lab}
    <path d="${area}" fill="var(--ice)" fill-opacity=".18"/>
    <path d="${line}" fill="none" stroke="var(--ice)" stroke-width="2" stroke-linejoin="round"/>
    ${bars}
    <line x1="${cx}" x2="${cx}" y1="${top-8}" y2="${base}" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="${cx}" y="${top-11}" font-size="9.5" text-anchor="middle" fill="var(--ink)">auj.</text>
    <path d="M${X(EVENT.nw-1).toFixed(1)} ${base} V${top-6} l-9 4 l9 4" fill="var(--warn)" stroke="var(--warn)"/>
    <text x="${(X(EVENT.nw-1)-4).toFixed(1)}" y="${top-8}" font-size="9.5" text-anchor="end" fill="var(--warn)">${EVENT.finishLabel}</text>
  </svg>
  <div class="legend"><span><i style="background:var(--ice);opacity:.5"></i>prévu</span><span><i style="background:var(--lichen)"></i>réalisé</span></div>`;
}

/* ============ Vues ============ */
function head() {
  const left = Math.max(0, dayDiff(EVENT.race, new Date()));
  return `<div class="top"><div><h1>${esc(EVENT.shortName)}</h1><div class="sub">${esc(S.profile.name)} · ${EVENT.dateLabel}</div></div><div class="count">J-${left}<small>avant le départ</small></div></div>`;
}

  if (!ev().assess) { app.innerHTML = onboardEvent(false); nav.hidden = true; return; }
  if (tab === 'editEvent') { app.innerHTML = onboardEvent(true); nav.hidden = true; return; }
  const v = tab === 'sem' ? semView() : tab === 'plan' ? planView() : tab === 'grp' ? grpView() : moiView();
  app.innerHTML = head() + v;
  nav.hidden = false;
  nav.innerHTML = [['sem','Semaine'],['plan','Plan'],['grp','Groupe'],['moi','Moi']].map(([k, t]) => `<button data-act="tab" data-v="${k}" class="${tab === k ? 'on' : ''}">${t}</button>`).join('');
  window.scrollTo(0, y);
}

/* ============ Fenêtres ============ */
function showModal(title, text, importMode) {
  $('#modal').innerHTML = `<div class="modal" data-act="closeBg"><div role="dialog" aria-label="${esc(title)}"><h3 style="margin-bottom:8px">${esc(title)}</h3><textarea id="mtxt" ${importMode ? 'placeholder="Colle ici tes données exportées"' : 'readonly'}>${esc(text)}</textarea>
  <div class="row"><button class="btn" data-act="${importMode ? 'doImport' : 'copyTxt'}">${importMode ? 'Importer' : 'Copier'}</button><button class="btn alt" data-act="closeModal">Fermer</button></div><p class="note" id="mmsg"></p></div></div>`;
  if (!importMode) { const t = $('#mtxt'); t.focus(); t.select(); }
}
function feedbackText() {
  const w = PLAN[vw], st = weekStats(w);
  let t = `Retour semaine ${vw + 1} (${fd(w.start)} – ${fd(w.end)}) · phase ${EVENT.phases[w.ph - 1]}${w.rec ? ' (allégée)' : ''}${w.light ? ' (−20 %)' : ''}\n`;
  t += `Course : ${hm(st.m)} faites sur ${hm(w.target)} prévues · séances ${st.n}/${st.t} · ${Math.round(st.k * 10) / 10} km · ${Math.round(st.d)} m D+\n`;
  if (st.fat) t += `Fatigue moyenne ${st.fat.toFixed(1)}/10`;
  if (st.rpe) t += ` · effort moyen ${st.rpe.toFixed(1)}/10`;
  t += '\n\nDétail :\n';
  const pains = [], notes = [];
  w.sessions.forEach(s => {
    const l = ev().log[s.id] || {};
    t += `- ${s.day} ${s.title} : ${l.done ? 'fait' + (l.min ? ', ' + l.min + ' min' : '') + (l.km ? ', ' + l.km + ' km' : '') + (l.dplus ? ', ' + l.dplus + ' m D+' : '') + (l.rpe ? ', effort ' + l.rpe + '/10' : '') : 'non fait'}\n`;
    if (l.pain && l.pain.trim()) pains.push(`${s.day} : ${l.pain.trim()}`);
    if (l.note && l.note.trim()) notes.push(`${s.day} : ${l.note.trim()}`);
  });
  t += `\nDouleurs : ${pains.length ? pains.join(' ; ') : 'aucune'}\n`;
  if (notes.length) t += `Notes : ${notes.join(' ; ')}\n`;
  if (S.profile.limits && S.profile.limits.trim()) t += `Limite connue : ${S.profile.limits.trim()}\n`;
  t += `\nPeux-tu ajuster ma semaine ${vw + 2} ?`;
  return t;
}

/* ============ Événements ============ */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'closeBg') { if (e.target === b) $('#modal').innerHTML = ''; return; }
  if (a === 'closeModal') { $('#modal').innerHTML = ''; return; }
  if (a === 'copyTxt') {
    const t = $('#mtxt'); t.select();
    let ok = false; try { await navigator.clipboard.writeText(t.value); ok = true; } catch (er) { try { ok = document.execCommand('copy'); } catch (e2) {} }
    $('#mmsg').textContent = ok ? 'Copié.' : 'Sélectionne le texte et copie-le manuellement.'; return;
  }
  if (a === 'doImport') {
    try {
      const d = JSON.parse($('#mtxt').value);
      if (!d || !d.profile || !d.profile.name) throw 0;
      S = {v:2, profile:d.profile, events:d.events || {}, share:d.share !== false, updated:0};
      rebuild(); persist(); $('#modal').innerHTML = ''; tab = 'sem'; render();
    } catch (er) { $('#mmsg').textContent = 'Données invalides.'; }
    return;
  }
  if (a === 'saveProfile') {
    const name = $('#f-name').value.trim();
    if (!name) { $('#f-name').focus(); return; }
    const injuryAreas = Array.from(document.querySelectorAll('[data-inj]:checked')).map(c => c.value);
    let sports = []; try { sports = JSON.parse($('#f-sports-json').value || '[]'); } catch (e) {}
    const p = {
      name, fullName:$('#f-fullname').value.trim(), ageRange:$('#f-age').value, activityLevel:$('#f-activity').value, sports,
      pastEndurance:$('#f-past').value,
      injuryAreas, limits:$('#f-limits').value,
      days:+$('#f-days').value, sessionDuration:$('#f-dur').value, constraints:$('#f-constraints').value
    };
    S.profile = p; rebuild(); persist(); tab = 'sem'; render(); return;
  }
  if (a === 'saveEvent') {
    const E = ev();
    E.assess = {
      longest:+$('#f-longest').value, weeklyKm:+$('#f-km').value,
      enduranceLevel:$('#f-end').value, upperBodyLevel:$('#f-up').value, legsLevel:$('#f-legs').value, gripLevel:$('#f-grip').value
    };
    rebuild(); persist(); tab = 'sem'; vw = Math.max(cur, E.startIdx); render(); return;
  }
  if (a === 'addSport') {
    const inp = $('#f-sport-input'); addSportValue(inp.value); inp.value = ''; inp.focus(); return;
  }
  if (a === 'rmSport') {
    let arr = []; try { arr = JSON.parse($('#f-sports-json').value || '[]'); } catch (e2) {}
    $('#f-sports-json').value = JSON.stringify(arr.filter(x => x !== b.dataset.sport));
    b.closest('[data-sport-chip]').remove(); return;
  }
  if (a === 'editProfile') { tab = 'editProfile'; render(); return; }
  if (a === 'editEvent') { tab = 'editEvent'; render(); return; }
  if (a === 'tab') { tab = b.dataset.v; if (tab === 'grp') ensureGroup(); render(); window.scrollTo(0, 0); return; }
  if (a === 'wk') { vw = Math.max(0, Math.min(EVENT.nw - 1, vw + +b.dataset.d)); openId = null; render(); return; }
  if (a === 'jump') { vw = +b.dataset.i; openId = null; tab = 'sem'; render(); window.scrollTo(0, 0); return; }
  if (a === 'open') { openId = openId === b.dataset.id ? null : b.dataset.id; render(); return; }
  if (a === 'tog') {
    const id = b.dataset.id, L = ev().log, l = L[id] || (L[id] = {});
    l.done = !l.done;
    if (l.done && !l.min) { const s = PLAN[vw].sessions.find(x => x.id === id); if (s && s.min) l.min = s.min; }
    persist(); render(); return;
  }
  if (a === 'apply') { ev().overrides[+b.dataset.i] = .8; rebuild(); persist(); render(); return; }
  if (a === 'undo') { delete ev().overrides[+b.dataset.i]; rebuild(); persist(); render(); return; }
  if (a === 'copy') { showModal('Mon retour de la semaine', feedbackText(), false); return; }
  if (a === 'share') { S.share = !S.share; persist(); render(); return; }
  if (a === 'export') { showModal('Mes données', JSON.stringify({profile:S.profile, events:S.events, share:S.share}), false); return; }
  if (a === 'import') { showModal('Importer mes données', '', true); return; }
  if (a === 'gopen') { gOpen = gOpen === b.dataset.id ? null : b.dataset.id; gWeek = cur; render(); return; }
  if (a === 'gwk') { gWeek = Math.max(0, Math.min(EVENT.nw - 1, gWeek + +b.dataset.d)); render(); return; }
});
document.addEventListener('change', e => {
  const f = e.target.dataset && e.target.dataset.f; if (!f) return;
  const L = ev().log, l = L[e.target.dataset.id] || (L[e.target.dataset.id] = {});
  l[f] = e.target.value; persist(); render();
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'f-sport-input' && e.key === 'Enter') {
    e.preventDefault(); addSportValue(e.target.value); e.target.value = '';
  }
});

/* ============ Démarrage ============ */
function ensureGroup() {
  if (groupSub || !Store.ok) return;
  try { groupSub = Store.subscribe(list => { GROUP = list; if (tab === 'grp') render(); }); } catch (e) {}
}
async function boot() {
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
  rebuild(); if (S.profile) vw = Math.max(cur, ev().startIdx); render();
  await Store.init();
  if (!Store.ok) return;
  try {
    const r = await Store.loadMine();
    if (r && r.json) {
      const remote = JSON.parse(r.json);
      if ((remote.updated || 0) > (S.updated || 0)) {
        S = remote; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
        rebuild(); if (S.profile) vw = Math.max(cur, ev().startIdx); render();
      } else if (S.profile) { dirty = true; flush(); }
    } else if (S.profile) { dirty = true; flush(); }
  } catch (e) {}
  if (tab === 'grp') ensureGroup();
}
boot();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('service-worker.js').catch(() => {}); }
</script>
